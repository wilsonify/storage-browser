<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1b1e;
      --surface: #25262b;
      --border: #373a40;
      --text: #c1c2c5;
      --text-dim: #909296;
      --accent: #339af0;
      --accent-hover: #228be6;
      --danger: #fa5252;
      --sidebar-w: 220px;
      --row-h: 30px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 10px 12px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    #bucket-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .bucket-item {
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      border-left: 2px solid transparent;
    }

    .bucket-item:hover { background: var(--bg); }
    .bucket-item.active {
      background: var(--bg);
      border-left-color: var(--accent);
      color: var(--accent);
    }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toolbar */
    #toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #breadcrumbs {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      min-width: 0;
      overflow: hidden;
    }

    .crumb {
      cursor: pointer;
      color: var(--accent);
      white-space: nowrap;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .crumb:hover { background: rgba(51, 154, 240, 0.1); }
    .crumb:last-child { color: var(--text); cursor: default; }
    .crumb-sep { color: var(--text-dim); }

    #search {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      width: 180px;
    }

    #search:focus { outline: none; border-color: var(--accent); }

    #status {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* Table */
    #table-wrap {
      flex: 1;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover { color: var(--text); }
    th .sort-arrow { margin-left: 4px; font-size: 10px; }

    td {
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }

    tr { height: var(--row-h); }
    tr.folder td:first-child { font-weight: 500; }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: rgba(51, 154, 240, 0.06); }
    tbody tr:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

    tbody tr.dragging { opacity: 0.4; }
    tbody tr.drop-target {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
      background: rgba(51, 154, 240, 0.08);
    }

    .icon { margin-right: 6px; font-size: 14px; vertical-align: middle; }
    .col-size, .col-modified { text-align: right; }
    .col-name { width: 100%; }

    .dim { color: var(--text-dim); }

    /* Loading / Error */
    #loading, #error, #empty {
      display: none;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-dim);
    }

    #error { color: var(--danger); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">Buckets</div>
    <div id="bucket-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <div id="breadcrumbs"></div>
      <input id="search" type="text" placeholder="Filter..." autofocus>
      <div id="status"></div>
    </div>
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-name" data-sort="name">Name<span class="sort-arrow"></span></th>
            <th class="col-size" data-sort="size">Size<span class="sort-arrow"></span></th>
            <th class="col-modified" data-sort="modified">Modified<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="loading">Loading...</div>
      <div id="error"></div>
      <div id="empty">Empty</div>
    </div>
  </div>

  <script>
    const API = "";
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    let currentBucket = null;
    let currentPrefix = "";
    let items = []; // folders + files
    let sortKey = "name";
    let sortAsc = true;
    let continuationToken = null;
    let allLoaded = false;
    let dragItem = null; // { type, name, path } of the item being dragged

    // --- Fetch helpers ---

    async function api(path) {
      const res = await fetch(API + path);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    // --- Format helpers ---

    function humanSize(bytes) {
      if (bytes == null) return "";
      if (bytes === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + " " + units[i];
    }

    function shortDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // --- Bucket list ---

    async function loadBuckets() {
      const list = $("#bucket-list");
      list.innerHTML = '<div class="dim" style="padding:12px">Loading...</div>';
      try {
        const buckets = await api("/api/buckets");
        buckets.sort((a, b) => a.name.localeCompare(b.name));
        list.innerHTML = buckets.map((b) =>
          `<div class="bucket-item" data-bucket="${escHtml(b.name)}" tabindex="0">${escHtml(b.name)}</div>`
        ).join("");
        list.querySelectorAll(".bucket-item").forEach((el) => {
          el.addEventListener("click", () => selectBucket(el.dataset.bucket));
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") selectBucket(el.dataset.bucket);
          });
        });
      } catch (err) {
        list.innerHTML = `<div id="error" style="display:block">${escHtml(err.message)}</div>`;
      }
    }

    async function selectBucket(name) {
      currentBucket = name;
      currentPrefix = "";
      continuationToken = null;
      allLoaded = false;

      $$(".bucket-item").forEach((el) => el.classList.toggle("active", el.dataset.bucket === name));
      await loadObjects();
    }

    // --- Object list ---

    async function loadObjects(append = false) {
      if (!currentBucket) return;

      showLoading(true);
      showError(null);
      showEmpty(false);

      const tbody = $("#tbody");
      if (!append) tbody.innerHTML = "";

      try {
        let url = `/api/buckets/${encodeURIComponent(currentBucket)}/objects?prefix=${encodeURIComponent(currentPrefix)}`;
        if (continuationToken) url += `&continuationToken=${encodeURIComponent(continuationToken)}`;

        const data = await api(url);

        if (append) {
          items = items.concat(data.folders, data.files);
        } else {
          items = data.folders.concat(data.files);
        }

        continuationToken = data.nextContinuationToken || null;
        allLoaded = !data.isTruncated;

        renderTable();
        renderBreadcrumbs();
        updateStatus();
      } catch (err) {
        showError(err.message);
      } finally {
        showLoading(false);
      }
    }

    function renderTable() {
      const filter = ($("#search").value || "").toLowerCase();
      const sorted = getSortedItems().filter((item) => !filter || item.name.toLowerCase().includes(filter));

      const tbody = $("#tbody");
      tbody.innerHTML = sorted.map((item, i) => {
        const isFolder = item.type === "folder";
        const icon = isFolder ? "\u{1F4C1}" : getFileIcon(item.name);
        const cls = isFolder ? " class=\"folder\"" : "";
        const date = isFolder ? "" : shortDate(item.modified);
        const size = isFolder ? "" : humanSize(item.size);
        const href = isFolder ? `javascript:void(0)` : `javascript:void(0)`;

        return `<tr${cls} data-idx="${i}" data-type="${item.type}" tabindex="0" draggable="true">
          <td class="col-name"><span class="icon">${icon}</span>${escHtml(item.name)}</td>
          <td class="col-size">${size}</td>
          <td class="col-modified dim">${date}</td>
        </tr>`;
      }).join("");

      if (items.length === 0 && !continuationToken) {
        showEmpty(true);
      }

      tbody.querySelectorAll("tr").forEach((tr) => {
        const idx = parseInt(tr.dataset.idx);
        const item = getSortedItems().filter((item) => {
          const filter = ($("#search").value || "").toLowerCase();
          return !filter || item.name.toLowerCase().includes(filter);
        })[idx];

        if (!item) return;

        tr.addEventListener("click", () => handleItem(item));
        tr.addEventListener("dblclick", () => handleItem(item));
        tr.addEventListener("keydown", (e) => {
          if (e.key === "Enter") handleItem(item);
        });

        // Drag-and-drop move
        tr.addEventListener("dragstart", (e) => {
          dragItem = { type: item.type, name: item.name, path: item.path || item.key };
          e.dataTransfer.setData("text/plain", JSON.stringify(dragItem));
          e.dataTransfer.effectAllowed = "move";
          tr.classList.add("dragging");
        });
        tr.addEventListener("dragend", () => {
          tr.classList.remove("dragging");
          $$(".drop-target").forEach((el) => el.classList.remove("drop-target"));
          dragItem = null;
        });

        // Folders are drop targets
        if (item.type === "folder") {
          tr.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            if (dragItem && dragItem.path !== item.path) tr.classList.add("drop-target");
          });
          tr.addEventListener("dragleave", (e) => {
            if (!tr.contains(e.relatedTarget)) tr.classList.remove("drop-target");
          });
          tr.addEventListener("drop", (e) => {
            e.preventDefault();
            tr.classList.remove("drop-target");
            if (dragItem) moveItem(dragItem, item);
          });
        }
      });
    }

    function handleItem(item) {
      if (item.type === "folder") {
        navigateTo(item.path || item.name);
      } else {
        downloadFile(item.key);
      }
    }

    function navigateTo(prefix) {
      currentPrefix = prefix;
      continuationToken = null;
      allLoaded = false;
      items = [];
      loadObjects();
    }

    function downloadFile(key) {
      const url = `/api/download?bucket=${encodeURIComponent(currentBucket)}&key=${encodeURIComponent(key)}`;
      window.open(url, "_blank");
    }

    async function moveItem(item, target) {
      if (!item || !target || item.path === target.path) return;

      const source = item.path;        // folder prefix or file key
      const destination = target.path; // folder prefix

      // A folder cannot be moved into itself or one of its subfolders
      if (source.endsWith("/") && destination.startsWith(source)) {
        showError(`Cannot move "${item.name}" into itself`);
        return;
      }

      if (!confirm(`Move "${item.name}" into "${target.name}"?`)) return;

      const status = $("#status");
      status.textContent = `Moving "${item.name}"...`;
      try {
        const res = await fetch(API + "/api/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bucket: currentBucket, source, destination }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        showError(null);
        await loadObjects();
      } catch (err) {
        showError(`Move failed: ${err.message}`);
        updateStatus();
      }
    }

    // --- Sorting ---

    function getSortedItems() {
      return [...items].sort((a, b) => {
        // Folders always first
        if (a.type !== b.type) return a.type === "folder" ? -1 : 1;

        let va = a[sortKey];
        let vb = b[sortKey];

        if (sortKey === "name") {
          va = (va || "").toLowerCase();
          vb = (vb || "").toLowerCase();
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        if (sortKey === "size") {
          va = va || 0;
          vb = vb || 0;
          return sortAsc ? va - vb : vb - va;
        }
        if (sortKey === "modified") {
          va = va || "";
          vb = vb || "";
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return 0;
      });
    }

    $$("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortAsc = !sortAsc;
        } else {
          sortKey = key;
          sortAsc = true;
        }
        updateSortArrows();
        renderTable();
      });
    });

    function updateSortArrows() {
      $$("th[data-sort]").forEach((th) => {
        const arrow = th.querySelector(".sort-arrow");
        if (th.dataset.sort === sortKey) {
          arrow.textContent = sortAsc ? " \u25B2" : " \u25BC";
        } else {
          arrow.textContent = "";
        }
      });
    }

    // --- Breadcrumbs ---

    function renderBreadcrumbs() {
      const bc = $("#breadcrumbs");
      const parts = currentPrefix ? currentPrefix.replace(/\/$/, "").split("/") : [];

      let html = `<span class="crumb" data-path="">${escHtml(currentBucket || "")}</span>`;

      let accumulated = "";
      parts.forEach((part) => {
        if (!part) return;
        accumulated += part + "/";
        html += `<span class="crumb-sep">/</span>`;
        html += `<span class="crumb" data-path="${escHtml(accumulated)}">${escHtml(part)}</span>`;
      });

      bc.innerHTML = html;

      bc.querySelectorAll(".crumb").forEach((el) => {
        el.addEventListener("click", () => {
          const path = el.dataset.path;
          if (path === currentPrefix) return;
          navigateTo(path);
        });
      });
    }

    // --- File icon ---

    function getFileIcon(name) {
      const ext = (name.split(".").pop() || "").toLowerCase();
      const audio = ["mp3", "wav", "flac", "aac", "ogg", "m4a"];
      const video = ["mp4", "mkv", "avi", "mov", "webm"];
      const image = ["png", "jpg", "jpeg", "gif", "webp", "svg", "bmp"];
      const doc = ["pdf", "doc", "docx"];
      const archive = ["zip", "gz", "tar", "rar", "7z"];
      const code = ["js", "ts", "py", "json", "yaml", "yml", "toml", "sql", "sh"];

      if (audio.includes(ext)) return "\u{1F3B5}";
      if (video.includes(ext)) return "\u{1F3AC}";
      if (image.includes(ext)) return "\u{1F5BC}";
      if (doc.includes(ext)) return "\u{1F4C4}";
      if (archive.includes(ext)) return "\u{1F4E6}";
      if (code.includes(ext)) return "\u{1F4BB}";
      return "\u{1F4C5}";
    }

    // --- UI state ---

    function showLoading(show) { $("#loading").style.display = show ? "block" : "none"; }
    function showError(msg) { const el = $("#error"); el.style.display = msg ? "block" : "none"; el.textContent = msg || ""; }
    function showEmpty(show) { $("#empty").style.display = show ? "block" : "none"; }

    function updateStatus() {
      const count = items.length;
      const extra = allLoaded ? "" : " (+more)";
      $("#status").textContent = count ? `${count} item${count === 1 ? "" : "s"}${extra}` : "";
    }

    // --- Search filter ---

    let searchTimeout;
    $("#search").addEventListener("input", () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(renderTable, 150);
    });

    // --- Keyboard navigation ---

    document.addEventListener("keydown", (e) => {
      if (e.target === $("#search")) return;

      // Arrow keys to navigate rows
      const rows = [...$$("tbody tr")];
      if (!rows.length) return;

      const current = document.activeElement;
      const idx = rows.indexOf(current);

      if (e.key === "ArrowDown" && idx < rows.length - 1) {
        e.preventDefault();
        rows[idx + 1].focus();
      } else if (e.key === "ArrowUp" && idx > 0) {
        e.preventDefault();
        rows[idx - 1].focus();
      } else if (e.key === "Enter" && current.closest("tr")) {
        current.closest("tr").click();
      } else if (e.key === "Backspace" && currentPrefix) {
        e.preventDefault();
        goUp();
      } else if (e.key === "/" || (e.key === "f" && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        $("#search").focus();
      }
    });

    function goUp() {
      const parts = currentPrefix.replace(/\/$/, "").split("/");
      parts.pop();
      navigateTo(parts.length ? parts.join("/") + "/" : "");
    }

    // --- Infinite scroll for pagination ---

    $("#table-wrap").addEventListener("scroll", () => {
      const el = $("#table-wrap");
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50 && allLoaded === false && !$("#loading").style.display.includes("block")) {
        loadObjects(true);
      }
    });

    // --- Init ---

    loadBuckets();
  </script>
</body>
</html>
