sonar.projectKey=storage-browser
sonar.projectName=S3 Browser
sonar.host.url=http://[::1]:9000
sonar.sourceEncoding=UTF-8

# Same tree the previous scans used. Only coverage wiring is added here.
sonar.sources=.

# Generated and vendored output is never source.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/tauri-dist/**,\
  **/.wrangler/**,\
  **/.sea-build/**,\
  **/coverage/**

# Generated by `npm run test:coverage` (docs/qa/coverage-policy.md). The local
# table, this lcov file and Sonar's `coverage` measure must agree; `npm run
# sonar:check` compares them and fails when they do not.
sonar.javascript.lcov.reportPaths=s3-browser/coverage/lcov.info

# Mirrors the documented Scope A exclusions. Each entry is explained in
# docs/qa/coverage-policy.md and tracked in docs/qa/remediation-plan.md.
sonar.coverage.exclusions=\
  s3-browser/index.html,\
  s3-browser/scripts/package-win.mjs,\
  s3-browser/scripts/build-sidecar.mjs,\
  s3-browser/scripts/clean.mjs,\
  s3-browser/scripts/timeout-probe.mjs,\
  s3-browser/scripts/coverage.mjs,\
  s3-browser/scripts/check-syntax.mjs,\
  s3-browser/scripts/check-deploy.mjs,\
  s3-browser/scripts/sonar-check.mjs,\
  s3-browser/test/**,\
  s3-browser/cloudflare/*.test.mjs,\
  s3-browser/src-tauri/**
