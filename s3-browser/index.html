<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Browser</title>
  <link rel="icon" type="image/svg+xml" href="/assets/s3_browser_icon.svg">
  <link rel="icon" type="image/x-icon" href="/assets/s3_browser_icon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #eff3f9;
      --surface: #ffffff;
      --surface-alt: #f4f7fc;
      --surface-strong: #eaf0f9;
      --border: #cfd9e7;
      --border-soft: #e5ebf4;
      --text: #1d2a38;
      --text-dim: #4e6075;
      --accent: #0e67bf;
      --accent-soft: #deecfb;
      --focus: #ff9f1a;
      --danger: #b42318;
      --success: #067647;
      --warn: #b54708;
      --sidebar-w: 250px;
      --row-h: 31px;
      --font: "Segoe UI", "Tahoma", "Verdana", sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #dce8f9 0%, transparent 46%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 42%);
      height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      overflow: hidden;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: var(--sidebar-w);
      overflow: hidden;
      box-shadow: 1px 0 0 rgba(255, 255, 255, 0.8);
    }

    #sidebar-header {
      padding: 10px 12px 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f5f8fd 100%);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.28);
      flex: 0 0 auto;
    }

    .brand-text {
      display: grid;
      min-width: 0;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 700;
      color: #1e2a3a;
      line-height: 1.2;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #5f7085;
      letter-spacing: 0.55px;
      margin-top: 2px;
    }

    #bucket-list {
      overflow-y: auto;
      flex: 1;
      padding: 4px 0;
    }

    .bucket-item {
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid transparent;
      line-height: 1.2;
      border-bottom: 1px solid #f4f7fb;
    }

    .bucket-item:hover { background: var(--surface-alt); }

    .bucket-item.active {
      border-left-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
      color: #13395b;
    }

    .bucket-item.drop-target {
      border-left-color: var(--active-border);
      background: #f7e6bc;
      font-weight: 600;
      color: #3d3012;
    }

    #main {
      display: grid;
      grid-template-rows: auto auto 1fr auto 180px;
      min-width: 0;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f3f7fd 100%);
      min-height: 44px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 32px;
      height: 29px;
      font-weight: 600;
      box-shadow: 0 1px 0 #ffffff;
    }

    .btn:hover:not(:disabled) {
      background: #f8fbff;
      border-color: #bed0e5;
    }

    .btn:active:not(:disabled) {
      background: #e9f1fb;
      border-color: #a9c2dd;
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: default;
      box-shadow: none;
    }

    #pathbar {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    #breadcrumbs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      overflow: hidden;
    }

    .crumb {
      cursor: pointer;
      color: var(--accent);
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .crumb:hover { background: var(--accent-soft); }
    .crumb.current { color: var(--text); cursor: default; }
    .crumb-sep { color: var(--text-dim); }

    #search {
      margin-left: auto;
      width: 260px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 12px;
      color: #22364a;
    }

    #search::placeholder { color: #6d7f93; }

    #search:focus {
      outline: none;
      border-color: #95b7dc;
      box-shadow: 0 0 0 2px rgba(14, 103, 191, 0.16);
    }

    #table-wrap {
      overflow: auto;
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f2f6fc;
    }

    th {
      text-align: left;
      padding: 7px 10px;
      color: #465a71;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.15px;
    }

    th:hover { color: var(--text); }

    td {
      padding: 5px 10px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      height: var(--row-h);
    }

    .col-name { width: 58%; }
    .col-size { width: 16%; text-align: right; }
    .col-modified { width: 26%; text-align: right; color: var(--text-dim); }

    tbody tr { cursor: default; }
    tbody tr:hover { background: #f0f6ff; }

    tbody tr.selected {
      background: #cfe6ff;
      outline: 1px solid #95bfe8;
      outline-offset: -1px;
    }

    tbody tr.focused {
      box-shadow: inset 0 0 0 1px #0f6ecb;
    }

    tbody tr.drop-target {
      outline: 2px dashed #0f6ecb;
      outline-offset: -2px;
      background: #e7f3ff;
    }

    .name-cell { display: flex; align-items: center; gap: 8px; }
    .icon { font-size: 14px; }

    .name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      display: inline-block;
      max-width: 100%;
    }

    #empty, #loading, #error {
      display: none;
      text-align: center;
      padding: 30px 18px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    #empty::before,
    #error::before,
    #loading::before {
      display: block;
      margin-bottom: 7px;
      font-size: 18px;
      opacity: 0.85;
    }

    #empty::before { content: "\1F4C1"; }
    #loading::before { content: "\23F3"; }
    #error::before { content: "\26A0"; }

    #error {
      color: var(--danger);
      font-weight: 600;
      overflow-wrap: anywhere;
      max-width: 920px;
      margin: 0 auto;
    }

    #statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, #f8fbff 0%, var(--surface-alt) 100%);
      font-size: 12px;
      color: var(--text-dim);
      gap: 10px;
    }

    #status-left,
    #status-right {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ops {
      border-top: 1px solid var(--border);
      background: #fff;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
    }

    #ops-header {
      padding: 8px 10px;
      font-weight: 700;
      color: #2e4055;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f5f8fd 100%);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #ops-header::before {
      content: "\2699";
      font-size: 14px;
      color: #627890;
    }

    #ops-list {
      overflow: auto;
      font-size: 12px;
    }

    .op-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-soft);
      align-items: center;
    }

    .op-main {
      min-width: 0;
    }

    .op-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .op-type {
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #2a3e55;
      flex: 0 0 auto;
    }

    .op-pill {
      border: 1px solid #c7d4e3;
      background: #eef3f9;
      border-radius: 999px;
      padding: 0 7px;
      line-height: 17px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #445a72;
      flex: 0 0 auto;
    }

    .op-pill.queued { border-color: #b9c8d9; background: #edf2f7; color: #4b6078; }
    .op-pill.running { border-color: #9ac3ed; background: #deecfb; color: #0b5fae; }
    .op-pill.completed { border-color: #9fd8be; background: #e1f5e9; color: #0f6a42; }
    .op-pill.failed { border-color: #edb6b2; background: #fde8e7; color: #9d2d24; }
    .op-pill.cancelled { border-color: #d5c4a0; background: #fdf5e6; color: #8b6211; }

    .op-meta {
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .op-progress {
      margin-top: 5px;
      height: 6px;
      width: 100%;
      border: 1px solid #c9d7e8;
      border-radius: 99px;
      background: #f3f7fc;
      overflow: hidden;
      display: none;
    }

    .op-row.running .op-progress,
    .op-row.completed .op-progress {
      display: block;
    }

    .op-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4b94d8 0%, #0e67bf 100%);
    }

    .op-row.completed .op-progress-fill {
      background: linear-gradient(90deg, #39a26f 0%, #067647 100%);
    }

    .op-status {
      font-weight: 600;
      min-width: 78px;
      text-align: right;
      text-transform: capitalize;
    }

    .op-status.queued { color: #596c84; }
    .op-status.running { color: #0b63b7; }
    .op-status.completed { color: #067647; }
    .op-status.failed { color: #b42318; }
    .op-status.cancelled { color: #9a6f10; }

    .op-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .op-action-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: #2f4760;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-size: 11px;
      font-weight: 600;
    }

    .op-action-btn:hover {
      background: #f4f8fd;
      border-color: #b8c9de;
    }

    .retry-btn {
      border-color: #dbb2b2;
      background: #fff5f5;
      color: #952a2a;
    }

    .cancel-btn {
      border-color: #cab683;
      background: #fff8e7;
      color: #866116;
    }

    .op-row.failed .retry-btn { display: inline-block; }

    #context-menu {
      position: fixed;
      z-index: 10;
      min-width: 170px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow: 0 12px 22px rgba(31, 52, 77, 0.24);
      display: none;
      overflow: hidden;
    }

    .menu-item {
      padding: 7px 11px;
      cursor: pointer;
      font-size: 12px;
    }

    .menu-item:hover { background: var(--accent-soft); }
    .menu-item.disabled {
      color: #62748a;
      cursor: default;
      background: #eef3f8;
    }
    .menu-divider { border-top: 1px solid #edf1f7; margin: 2px 0; }

    .panel-note {
      padding: 10px;
      color: #5f6b7a;
    }

    .panel-error {
      padding: 10px;
      color: #b42318;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1100px) {
      :root { --sidebar-w: 200px; }
      #main { grid-template-rows: auto auto 1fr auto 150px; }
      #search { width: 180px; }
      .col-name { width: 54%; }
      .col-size { width: 19%; }
      .col-modified { width: 27%; }
    }

    @media (max-width: 820px) {
      body { grid-template-columns: 190px 1fr; }
      #toolbar { gap: 6px; }
      #search { width: 145px; }
      .crumb { max-width: 140px; }
      #status-right { display: none; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <img src="/assets/s3_browser_icon.svg" alt="S3 Browser" class="brand-icon">
      <div class="brand-text">
        <div class="brand-title">S3 Browser</div>
        <div class="brand-subtitle">Buckets</div>
      </div>
    </div>
    <div id="bucket-list"></div>
  </aside>

  <section id="main">
    <div id="toolbar">
      <button class="btn" id="nav-back" title="Back">&#8592;</button>
      <button class="btn" id="nav-forward" title="Forward">&#8594;</button>
      <button class="btn" id="nav-up" title="Up">&#8593;</button>
      <button class="btn" id="nav-refresh" title="Refresh">&#8635;</button>
    </div>

    <div id="pathbar">
      <div id="breadcrumbs"></div>
      <label for="search" class="sr-only">Filter current folder</label>
      <input id="search" type="text" placeholder="Filter current folder">
    </div>

    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-name" data-sort="name">Name <span class="sort-arrow"></span></th>
            <th class="col-size" data-sort="size">Size <span class="sort-arrow"></span></th>
            <th class="col-modified" data-sort="modified">Modified <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="loading">Loading...</div>
      <div id="error"></div>
      <div id="empty">This folder is empty.</div>
    </div>

    <div id="statusbar">
      <div id="status-left"></div>
      <div id="status-right"></div>
    </div>

    <section id="ops">
      <div id="ops-header">Operations</div>
      <div id="ops-list"></div>
    </section>
  </section>

  <div id="context-menu"></div>

  <script>
    const API = "";
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const state = {
      currentBucket: null,
      currentPrefix: "",
      items: [],
      visible: [],
      continuationToken: null,
      allLoaded: false,
      sortKey: "name",
      sortAsc: true,
      history: [],
      historyIndex: -1,
      selected: new Set(),
      focusedPath: null,
      anchorPath: null,
      clipboard: null,
      dragSources: [],
      dragKind: null,
      operations: [],
      loading: false,
      opsTimer: null,
    };

    async function api(path, options = undefined) {
      const res = await fetch(API + path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;");
    }

    function humanSize(bytes) {
      if (bytes == null) return "";
      if (bytes === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function shortDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function statusText(op) {
      const p = op.progress || { total: 0, completed: 0, message: "" };
      const pieces = [op.status];
      if (op.status === "running" || op.status === "completed") {
        if (p.total > 0) {
          pieces.push(`${p.completed}/${p.total}`);
        }
      }
      if (op.status === "failed" && op.error) pieces.push(op.error);
      return pieces.join(" - ");
    }

    function selectedArray() {
      return [...state.selected];
    }

    function pathForItem(item) {
      return item.type === "folder" ? item.path : item.key;
    }

    function findItemByPath(path) {
      return state.visible.find((item) => pathForItem(item) === path) || null;
    }

    function ensureFolderPrefix(prefix) {
      return prefix.endsWith("/") ? prefix : `${prefix}/`;
    }

    function normalizeDestinationPrefix(prefix) {
      if (!prefix || prefix === "/") return "";
      return prefix.startsWith("/") ? prefix.slice(1) : prefix;
    }

    function parseFileUri(value) {
      if (!value || typeof value !== "string") return null;

      const trimmed = value.trim().replace(/^"|"$/g, "");
      if (/^[A-Za-z]:[\\/]/.test(trimmed)) {
        return trimmed.replace(/\//g, "\\");
      }

      if (!trimmed.startsWith("file://")) return null;

      try {
        const decoded = decodeURIComponent(trimmed.replace("file://", ""));
        if (/^\/[A-Za-z]:\//.test(decoded)) {
          return decoded.slice(1).replace(/\//g, "\\");
        }
        return decoded.replace(/\//g, "\\");
      } catch {
        return null;
      }
    }

    function extractLocalPathsFromDataTransfer(dataTransfer) {
      const seen = new Set();
      const out = [];

      const addPath = (raw) => {
        if (typeof raw !== "string") return;
        const value = raw.trim();
        if (!value || seen.has(value)) return;
        seen.add(value);
        out.push(value);
      };

      if (dataTransfer?.files) {
        for (const file of dataTransfer.files) {
          if (typeof file.path === "string" && file.path) {
            addPath(file.path);
          }
        }
      }

      if (dataTransfer?.items) {
        for (const item of dataTransfer.items) {
          const f = typeof item.getAsFile === "function" ? item.getAsFile() : null;
          if (f && typeof f.path === "string" && f.path) {
            addPath(f.path);
          }
        }
      }

      for (const flavor of ["text/uri-list", "text/plain"]) {
        const text = dataTransfer?.getData?.(flavor);
        if (!text) continue;
        text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line && !line.startsWith("#"))
          .forEach((line) => {
            const parsed = parseFileUri(line);
            if (parsed) addPath(parsed);
          });
      }

      return out;
    }

    function hasExternalDropPayload(dataTransfer) {
      const types = Array.from(dataTransfer?.types || []);
      if (types.includes("Files")) return true;
      if (types.includes("text/uri-list")) return true;
      if (dataTransfer?.files?.length > 0) return true;

      if (dataTransfer?.items?.length > 0) {
        for (const item of dataTransfer.items) {
          if (item?.kind === "file") return true;
          if (typeof item?.getAsFile === "function" && item.getAsFile()) return true;
        }
      }

      return false;
    }

    async function enqueueLocalSyncOperation({ bucket, destination, sources }) {
      if (!bucket || !Array.isArray(sources) || sources.length === 0) return;

      await enqueueOperation("syncLocalToS3", {
        bucket,
        destination: normalizeDestinationPrefix(destination),
        sources,
      });
    }

    async function handleDropToDestination(event, bucket, destinationPrefix) {
      const dataTransfer = event.dataTransfer;

      if (state.dragKind === "internal" && state.dragSources.length) {
        if (!bucket || bucket !== state.currentBucket) return;
        await enqueueOperation("move", {
          bucket,
          sources: state.dragSources,
          destination: ensureFolderPrefix(destinationPrefix || ""),
        });
        await refreshCurrentFolder();
        return;
      }

      if (hasExternalDropPayload(dataTransfer)) {
        const sources = extractLocalPathsFromDataTransfer(dataTransfer);
        if (sources.length === 0) {
          setError("Unable to read local file paths from the dropped items.");
          return;
        }

        await enqueueLocalSyncOperation({
          bucket,
          destination: destinationPrefix || "",
          sources,
        });
      }
    }

    function parentPrefix(prefix) {
      const trimmed = prefix.replace(/\/$/, "");
      const idx = trimmed.lastIndexOf("/");
      return idx === -1 ? "" : `${trimmed.slice(0, idx + 1)}`;
    }

    function itemLabel(item) {
      return item.type === "folder" ? `${item.name}/` : item.name;
    }

    function setLoading(show) {
      state.loading = show;
      $("#loading").style.display = show ? "block" : "none";
    }

    function setError(msg) {
      const el = $("#error");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg ? `Unable to load content. ${msg}` : "";
    }

    function setEmpty(show) {
      $("#empty").style.display = show ? "block" : "none";
    }

    function pushHistory(prefix) {
      const current = state.history[state.historyIndex];
      if (current && current.bucket === state.currentBucket && current.prefix === prefix) return;
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push({ bucket: state.currentBucket, prefix });
      state.historyIndex = state.history.length - 1;
      renderNavState();
    }

    function renderNavState() {
      $("#nav-back").disabled = state.historyIndex <= 0;
      $("#nav-forward").disabled = state.historyIndex >= state.history.length - 1 || state.historyIndex < 0;
      $("#nav-up").disabled = !state.currentPrefix;
    }

    async function loadBuckets() {
      const list = $("#bucket-list");
      list.innerHTML = '<div class="panel-note">Loading buckets...</div>';

      try {
        const buckets = await api("/api/buckets");
        buckets.sort((a, b) => a.name.localeCompare(b.name));
        list.innerHTML = buckets
          .map((b) => `<div class="bucket-item" data-bucket="${escHtml(b.name)}">${escHtml(b.name)}</div>`)
          .join("");

        list.querySelectorAll(".bucket-item").forEach((el) => {
          el.addEventListener("click", () => selectBucket(el.dataset.bucket));

          el.addEventListener("dragover", (e) => {
            if (!hasExternalDropPayload(e.dataTransfer)) return;
            e.preventDefault();
            el.classList.add("drop-target");
            e.dataTransfer.dropEffect = "copy";
          });

          el.addEventListener("dragleave", () => {
            el.classList.remove("drop-target");
          });

          el.addEventListener("drop", async (e) => {
            el.classList.remove("drop-target");
            e.preventDefault();
            try {
              await handleDropToDestination(e, el.dataset.bucket, "");
            } catch (err) {
              setError(err?.message || "Drop failed");
            }
          });
        });
      } catch (err) {
        list.innerHTML = `<div class="panel-error">${escHtml(err.message)}</div>`;
      }
    }

    async function selectBucket(name) {
      state.currentBucket = name;
      state.currentPrefix = "";
      resetViewState();
      syncActiveBucket();
      pushHistory("");
      await loadObjects(false);
    }

    function resetViewState() {
      state.items = [];
      state.continuationToken = null;
      state.allLoaded = false;
      state.selected.clear();
      state.focusedPath = null;
      state.anchorPath = null;
    }

    function syncActiveBucket() {
      $$(".bucket-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.bucket === state.currentBucket);
      });
    }

    async function loadObjects(append = false) {
      if (!state.currentBucket || state.loading) return;

      setLoading(true);
      setError(null);
      if (!append) {
        $("#tbody").innerHTML = "";
        state.items = [];
        state.continuationToken = null;
      }

      try {
        let url = `/api/buckets/${encodeURIComponent(state.currentBucket)}/objects?prefix=${encodeURIComponent(state.currentPrefix)}`;
        if (append && state.continuationToken) {
          url += `&continuationToken=${encodeURIComponent(state.continuationToken)}`;
        }

        const data = await api(url);
        const nextItems = data.folders.concat(data.files);
        state.items = append ? state.items.concat(nextItems) : nextItems;
        state.continuationToken = data.nextContinuationToken || null;
        state.allLoaded = !data.isTruncated;

        renderBreadcrumbs();
        renderTable();
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    }

    function renderBreadcrumbs() {
      const bc = $("#breadcrumbs");
      if (!state.currentBucket) {
        bc.innerHTML = "";
        return;
      }

      const parts = state.currentPrefix ? state.currentPrefix.replace(/\/$/, "").split("/") : [];
      let html = `<span class="crumb" data-path="">${escHtml(state.currentBucket)}</span>`;
      let acc = "";

      parts.forEach((part, idx) => {
        if (!part) return;
        acc += `${part}/`;
        html += `<span class="crumb-sep">/</span>`;
        const cls = idx === parts.length - 1 ? "crumb current" : "crumb";
        html += `<span class="${cls}" data-path="${escHtml(acc)}">${escHtml(part)}</span>`;
      });

      bc.innerHTML = html;
      bc.querySelectorAll(".crumb").forEach((el) => {
        el.addEventListener("click", () => {
          const path = el.dataset.path;
          if (path === state.currentPrefix) return;
          navigateTo(path, true);
        });
      });
    }

    function getSortedVisibleItems() {
      const filter = ($("#search").value || "").trim().toLowerCase();
      const sorted = [...state.items].sort((a, b) => {
        if (a.type !== b.type) return a.type === "folder" ? -1 : 1;

        let va = a[state.sortKey];
        let vb = b[state.sortKey];

        if (state.sortKey === "name") {
          va = (va || "").toLowerCase();
          vb = (vb || "").toLowerCase();
          return state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        }

        if (state.sortKey === "size") {
          va = va || 0;
          vb = vb || 0;
          return state.sortAsc ? va - vb : vb - va;
        }

        va = va || "";
        vb = vb || "";
        return state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      });

      state.visible = sorted.filter((item) => !filter || item.name.toLowerCase().includes(filter));
      return state.visible;
    }

    function renderTable() {
      const visible = getSortedVisibleItems();
      const tbody = $("#tbody");

      tbody.innerHTML = visible
        .map((item) => {
          const path = pathForItem(item);
          const selected = state.selected.has(path) ? " selected" : "";
          const focused = state.focusedPath === path ? " focused" : "";
          const icon = item.type === "folder" ? "&#128193;" : fileIcon(item.name);
          const name = escHtml(item.name);
          const displayName = item.type === "folder" ? `${name}/` : name;
          return `<tr class="${selected}${focused}" data-path="${escHtml(path)}" data-type="${item.type}" draggable="true">
            <td class="col-name"><div class="name-cell"><span class="icon">${icon}</span><span class="name-text" title="${displayName}">${displayName}</span></div></td>
            <td class="col-size">${item.type === "folder" ? "" : humanSize(item.size)}</td>
            <td class="col-modified">${item.type === "folder" ? "" : shortDate(item.modified)}</td>
          </tr>`;
        })
        .join("");

      setEmpty(visible.length === 0 && !state.loading);
      bindRows();
      updateStatusBar();
    }

    function bindRows() {
      $("#tbody").querySelectorAll("tr").forEach((tr) => {
        const path = tr.dataset.path;
        const item = findItemByPath(path);
        if (!item) return;

        tr.addEventListener("click", (e) => selectItemFromClick(item, e));
        tr.addEventListener("dblclick", () => activateItem(item));
        tr.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          if (!state.selected.has(path)) {
            state.selected.clear();
            state.selected.add(path);
            state.focusedPath = path;
            state.anchorPath = path;
            renderTable();
          }
          openContextMenu(e.clientX, e.clientY, item);
        });

        tr.addEventListener("dragstart", (e) => {
          const selected = selectedArray();
          const sourcePaths = selected.length && state.selected.has(path) ? selected : [path];
          state.dragSources = sourcePaths;
          state.dragKind = "internal";
          e.dataTransfer.setData("text/plain", JSON.stringify(sourcePaths));
          e.dataTransfer.setData("application/x-s3-browser-internal", "1");
          e.dataTransfer.effectAllowed = "move";
        });

        tr.addEventListener("dragend", () => {
          state.dragSources = [];
          state.dragKind = null;
          $$(".drop-target").forEach((el) => el.classList.remove("drop-target"));
        });

        if (item.type === "folder") {
          tr.addEventListener("dragover", (e) => {
            if (!(state.dragKind === "internal" || hasExternalDropPayload(e.dataTransfer))) return;
            e.preventDefault();
            tr.classList.add("drop-target");
            e.dataTransfer.dropEffect = state.dragKind === "internal" ? "move" : "copy";
          });

          tr.addEventListener("dragleave", () => {
            tr.classList.remove("drop-target");
          });

          tr.addEventListener("drop", async (e) => {
            e.preventDefault();
            tr.classList.remove("drop-target");
            try {
              await handleDropToDestination(e, state.currentBucket, item.path);
            } catch (err) {
              setError(err?.message || "Drop failed");
            }
          });
        }
      });
    }

    function selectItemFromClick(item, e) {
      const path = pathForItem(item);
      const visiblePaths = state.visible.map(pathForItem);

      if (e.shiftKey && state.anchorPath && visiblePaths.includes(state.anchorPath)) {
        const a = visiblePaths.indexOf(state.anchorPath);
        const b = visiblePaths.indexOf(path);
        const [start, end] = a < b ? [a, b] : [b, a];

        state.selected.clear();
        for (let i = start; i <= end; i += 1) {
          state.selected.add(visiblePaths[i]);
        }
      } else if (e.ctrlKey || e.metaKey) {
        if (state.selected.has(path)) {
          state.selected.delete(path);
        } else {
          state.selected.add(path);
        }
        state.anchorPath = path;
      } else {
        state.selected.clear();
        state.selected.add(path);
        state.anchorPath = path;
      }

      state.focusedPath = path;
      renderTable();
    }

    function activateItem(item) {
      if (item.type === "folder") {
        navigateTo(item.path, true);
      } else {
        const url = `/api/download?bucket=${encodeURIComponent(state.currentBucket)}&key=${encodeURIComponent(item.key)}`;
        window.open(url, "_blank");
      }
    }

    async function navigateTo(prefix, push = true) {
      state.currentPrefix = prefix;
      state.selected.clear();
      state.focusedPath = null;
      state.anchorPath = null;
      state.continuationToken = null;
      state.allLoaded = false;
      if (push) pushHistory(prefix);
      await loadObjects(false);
    }

    async function navigateBack() {
      if (state.historyIndex <= 0) return;
      state.historyIndex -= 1;
      const point = state.history[state.historyIndex];
      if (!point) return;
      state.currentBucket = point.bucket;
      state.currentPrefix = point.prefix;
      resetViewState();
      syncActiveBucket();
      renderNavState();
      await loadObjects(false);
    }

    async function navigateForward() {
      if (state.historyIndex >= state.history.length - 1) return;
      state.historyIndex += 1;
      const point = state.history[state.historyIndex];
      if (!point) return;
      state.currentBucket = point.bucket;
      state.currentPrefix = point.prefix;
      resetViewState();
      syncActiveBucket();
      renderNavState();
      await loadObjects(false);
    }

    async function navigateUp() {
      if (!state.currentPrefix) return;
      const next = parentPrefix(state.currentPrefix);
      await navigateTo(next, true);
    }

    async function refreshCurrentFolder() {
      await loadObjects(false);
    }

    function updateSortArrows() {
      $$("th[data-sort]").forEach((th) => {
        const arrow = th.querySelector(".sort-arrow");
        arrow.textContent = th.dataset.sort === state.sortKey ? (state.sortAsc ? "▲" : "▼") : "";
      });
    }

    function fileIcon(name) {
      const ext = (name.split(".").pop() || "").toLowerCase();
      if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext)) return "&#128443;";
      if (["mp3", "wav", "flac", "ogg"].includes(ext)) return "&#127925;";
      if (["mp4", "mkv", "avi", "mov"].includes(ext)) return "&#127909;";
      if (["zip", "gz", "tar", "7z", "rar"].includes(ext)) return "&#128230;";
      if (["pdf", "doc", "docx"].includes(ext)) return "&#128196;";
      if (["js", "ts", "json", "py", "go", "java", "sh", "yml", "yaml"].includes(ext)) return "&#128187;";
      return "&#128196;";
    }

    async function enqueueOperation(type, payload) {
      await api("/api/operations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, payload }),
      });
      await loadOperations();
    }

    async function runDeleteSelection() {
      const paths = selectedArray();
      if (!paths.length || !state.currentBucket) return;
      if (!confirm(`Delete ${paths.length} selected item(s)?`)) return;

      await enqueueOperation("delete", {
        bucket: state.currentBucket,
        targets: paths,
      });

      await refreshCurrentFolder();
    }

    async function runRenameSelection() {
      const paths = selectedArray();
      if (paths.length !== 1) return;
      const item = findItemByPath(paths[0]);
      if (!item) return;

      const initial = item.type === "folder" ? item.name : item.name;
      const newName = prompt("Rename to:", initial);
      if (!newName || newName === initial) return;

      await enqueueOperation("rename", {
        bucket: state.currentBucket,
        source: paths[0],
        newName,
      });

      await refreshCurrentFolder();
    }

    async function runPaste() {
      if (!state.clipboard || !state.currentBucket) return;
      const mode = state.clipboard.mode;
      const entries = state.clipboard.entries;
      if (!entries.length) return;

      if (mode === "copy") {
        await enqueueOperation("copy", {
          bucket: state.currentBucket,
          sources: entries,
          destination: ensureFolderPrefix(state.currentPrefix),
        });
      } else if (mode === "cut") {
        await enqueueOperation("move", {
          bucket: state.currentBucket,
          sources: entries,
          destination: ensureFolderPrefix(state.currentPrefix),
        });
        state.clipboard = null;
      }

      await refreshCurrentFolder();
    }

    function setClipboard(mode) {
      const entries = selectedArray();
      if (!entries.length) return;
      state.clipboard = {
        mode,
        entries,
        bucket: state.currentBucket,
      };
      updateStatusBar();
    }

    function openContextMenu(x, y, item) {
      const hasSelection = state.selected.size > 0;
      const canRename = state.selected.size === 1;
      const canPaste = !!state.clipboard;

      const menu = $("#context-menu");
      menu.innerHTML = `
        <div class="menu-item" data-action="open">Open</div>
        <div class="menu-item ${canRename ? "" : "disabled"}" data-action="rename">Rename</div>
        <div class="menu-divider"></div>
        <div class="menu-item ${hasSelection ? "" : "disabled"}" data-action="copy">Copy</div>
        <div class="menu-item ${hasSelection ? "" : "disabled"}" data-action="cut">Cut</div>
        <div class="menu-item ${canPaste ? "" : "disabled"}" data-action="paste">Paste</div>
        <div class="menu-divider"></div>
        <div class="menu-item ${hasSelection ? "" : "disabled"}" data-action="delete">Delete</div>
        <div class="menu-item" data-action="refresh">Refresh</div>
      `;

      menu.style.display = "block";
      menu.style.left = `${x}px`;
      menu.style.top = `${y}px`;

      menu.querySelectorAll(".menu-item").forEach((el) => {
        if (el.classList.contains("disabled")) return;
        el.addEventListener("click", async () => {
          const action = el.dataset.action;
          closeContextMenu();

          if (action === "open" && item) {
            activateItem(item);
          } else if (action === "rename") {
            await runRenameSelection();
          } else if (action === "copy") {
            setClipboard("copy");
          } else if (action === "cut") {
            setClipboard("cut");
          } else if (action === "paste") {
            await runPaste();
          } else if (action === "delete") {
            await runDeleteSelection();
          } else if (action === "refresh") {
            await refreshCurrentFolder();
          }
        });
      });
    }

    function closeContextMenu() {
      const menu = $("#context-menu");
      menu.style.display = "none";
      menu.innerHTML = "";
    }

    function moveFocusBy(delta, withShift) {
      if (!state.visible.length) return;
      const paths = state.visible.map(pathForItem);
      let idx = state.focusedPath ? paths.indexOf(state.focusedPath) : -1;
      if (idx === -1) idx = 0;
      idx = Math.max(0, Math.min(paths.length - 1, idx + delta));
      const path = paths[idx];

      if (withShift && state.anchorPath && paths.includes(state.anchorPath)) {
        const a = paths.indexOf(state.anchorPath);
        const [start, end] = a < idx ? [a, idx] : [idx, a];
        state.selected.clear();
        for (let i = start; i <= end; i += 1) state.selected.add(paths[i]);
      } else {
        state.selected.clear();
        state.selected.add(path);
        state.anchorPath = path;
      }

      state.focusedPath = path;
      renderTable();

      const row = $("#tbody").querySelector(`tr[data-path="${CSS.escape(path)}"]`);
      row?.scrollIntoView({ block: "nearest" });
    }

    function updateStatusBar() {
      const total = state.visible.length;
      const selected = state.selected.size;
      const queue = state.operations.filter((op) => op.status === "queued").length;
      const running = state.operations.filter((op) => op.status === "running").length;
      const failed = state.operations.filter((op) => op.status === "failed").length;
      const more = state.allLoaded ? "" : " (+more)";

      $("#status-left").textContent = `${total} item(s)${more} | ${selected} selected`;
      const clip = state.clipboard ? `${state.clipboard.mode.toUpperCase()}: ${state.clipboard.entries.length}` : "Clipboard: empty";
      $("#status-right").textContent = `Ops Q:${queue} R:${running} F:${failed} | ${clip}`;
    }

    async function loadOperations() {
      try {
        const data = await api("/api/operations");
        state.operations = data.operations || [];
        renderOperations();
      } catch (err) {
        const list = $("#ops-list");
        list.innerHTML = `<div class="panel-error">${escHtml(err.message)}</div>`;
      }
    }

    function renderOperations() {
      const list = $("#ops-list");
      if (!state.operations.length) {
        list.innerHTML = '<div style="padding:12px 10px;color:#5f6b7a">No operations yet. Background copy, move, rename, and delete tasks will appear here.</div>';
        updateStatusBar();
        return;
      }

      list.innerHTML = state.operations
        .map((op) => {
          const p = op.progress || {};
          const total = p.total || 0;
          const completed = p.completed || 0;
          const pct = total > 0 ? Math.min(100, Math.round((completed / total) * 100)) : 0;
          const summary = op.type.toUpperCase();
          let details = "";
          if (op.status === "failed" && op.error) {
            details = op.error;
          } else {
            const progressText = total ? ` (${completed}/${total}, ${pct}%)` : "";
            details = `${p.message || ""}${progressText}`;
          }

          const skipped = op.result?.skipped;
          if (skipped) {
            const skippedCount = (skipped.destinationSelf?.length || 0) + (skipped.recursive?.length || 0) + (skipped.redundantNested?.length || 0);
            if (skippedCount > 0) {
              details = `${details} | Skipped ${skippedCount}`.trim();
            }
          }

          const showProgress = op.status === "running" || op.status === "completed";
          const progressPct = showProgress ? (total > 0 ? pct : (op.status === "completed" ? 100 : 14)) : 0;

          return `<div class="op-row ${op.status}">
            <div class="op-main">
              <div class="op-title">
                <span class="op-type">${summary}</span>
                <span class="op-pill ${op.status}">${escHtml(op.status)}</span>
              </div>
              <div class="op-meta" title="${escHtml(details || statusText(op))}">${escHtml(details || statusText(op))}</div>
              <div class="op-progress"><div class="op-progress-fill" style="width:${progressPct}%"></div></div>
            </div>
            <div class="op-status ${op.status}">${escHtml(op.status)}</div>
            <div class="op-actions">
              <button class="op-action-btn retry-btn" data-op-id="${escHtml(op.id)}">Retry</button>
              <button class="op-action-btn cancel-btn" data-op-id="${escHtml(op.id)}" style="display:${op.status === "queued" || op.status === "running" ? "inline-block" : "none"}">Cancel</button>
            </div>
          </div>`;
        })
        .join("");

      list.querySelectorAll(".retry-btn").forEach((btn) => {
        if (btn.classList.contains("cancel-btn")) return;
        btn.addEventListener("click", async () => {
          const opId = btn.dataset.opId;
          await api(`/api/operations/${encodeURIComponent(opId)}/retry`, { method: "POST" });
          await loadOperations();
        });
      });

      list.querySelectorAll(".cancel-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const opId = btn.dataset.opId;
          await api(`/api/operations/${encodeURIComponent(opId)}/cancel`, { method: "POST" });
          await loadOperations();
        });
      });

      updateStatusBar();
    }

    function attachEvents() {
      $("#nav-back").addEventListener("click", navigateBack);
      $("#nav-forward").addEventListener("click", navigateForward);
      $("#nav-up").addEventListener("click", navigateUp);
      $("#nav-refresh").addEventListener("click", refreshCurrentFolder);

      $$("th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.sort;
          if (state.sortKey === key) state.sortAsc = !state.sortAsc;
          else {
            state.sortKey = key;
            state.sortAsc = true;
          }
          updateSortArrows();
          renderTable();
        });
      });

      let searchTimer;
      $("#search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderTable, 120);
      });

      $("#table-wrap").addEventListener("scroll", async () => {
        const el = $("#table-wrap");
        if (state.loading || state.allLoaded || !state.continuationToken) return;
        if (el.scrollTop + el.clientHeight >= el.scrollHeight - 80) {
          await loadObjects(true);
        }
      });

      $("#table-wrap").addEventListener("dragover", (e) => {
        if (!(state.dragKind === "internal" || hasExternalDropPayload(e.dataTransfer))) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = state.dragKind === "internal" ? "move" : "copy";
      });

      $("#table-wrap").addEventListener("drop", async (e) => {
        if (!(state.dragKind === "internal" || hasExternalDropPayload(e.dataTransfer))) return;
        e.preventDefault();
        try {
          await handleDropToDestination(e, state.currentBucket, state.currentPrefix || "");
        } catch (err) {
          setError(err?.message || "Drop failed");
        }
      });

      document.addEventListener("click", () => closeContextMenu());

      $("#table-wrap").addEventListener("contextmenu", (e) => {
        if (e.target.closest("tr")) return;
        e.preventDefault();
        openContextMenu(e.clientX, e.clientY, null);
      });

      document.addEventListener("keydown", async (e) => {
        const inInput = e.target === $("#search");

        if (!inInput && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") {
          e.preventDefault();
          state.selected = new Set(state.visible.map(pathForItem));
          state.focusedPath = state.visible[0] ? pathForItem(state.visible[0]) : null;
          state.anchorPath = state.focusedPath;
          renderTable();
          return;
        }

        if (!inInput && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
          e.preventDefault();
          setClipboard("copy");
          return;
        }

        if (!inInput && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "x") {
          e.preventDefault();
          setClipboard("cut");
          return;
        }

        if (!inInput && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
          e.preventDefault();
          await runPaste();
          return;
        }

        if (!inInput && e.key === "Delete") {
          e.preventDefault();
          await runDeleteSelection();
          return;
        }

        if (!inInput && e.key === "F2") {
          e.preventDefault();
          await runRenameSelection();
          return;
        }

        if (!inInput && e.key === "Backspace") {
          e.preventDefault();
          await navigateUp();
          return;
        }

        if (!inInput && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
          e.preventDefault();
          moveFocusBy(e.key === "ArrowDown" ? 1 : -1, e.shiftKey);
          return;
        }

        if (!inInput && e.key === "Home") {
          e.preventDefault();
          moveFocusBy(-999999, e.shiftKey);
          return;
        }

        if (!inInput && e.key === "End") {
          e.preventDefault();
          moveFocusBy(999999, e.shiftKey);
          return;
        }

        if (!inInput && e.key === "Enter") {
          e.preventDefault();
          const path = state.focusedPath || selectedArray()[0];
          if (!path) return;
          const item = findItemByPath(path);
          if (item) activateItem(item);
          return;
        }

        if ((e.key === "f" && (e.ctrlKey || e.metaKey)) || e.key === "/") {
          e.preventDefault();
          $("#search").focus();
        }
      });
    }

    async function boot() {
      attachEvents();
      updateSortArrows();
      renderNavState();
      await loadBuckets();
      await loadOperations();

      state.opsTimer = setInterval(loadOperations, 1200);
    }

    boot();
  </script>
</body>
</html>
