apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s3-browser.fullname" . }}
  labels:
    {{- include "s3-browser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s3-browser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s3-browser.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: s3-browser
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3737
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-browser.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-browser.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- if .Values.aws.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.aws.endpoint | quote }}
            {{- end }}
          volumeMounts:
            - name: state
              mountPath: /home/node/.s3-browser
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "s3-browser.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
